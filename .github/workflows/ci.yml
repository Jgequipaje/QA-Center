name: CI Pipeline

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  prettier:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ← ADD THIS - Allows pushing commits back
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # ← ADD THIS - Use GitHub's token
      - uses: actions/setup-node@v4
      - run: npm ci
      - name: Check prettier
        run: npx prettier --check .
      - name: Auto-fix prettier (if check fails)
        if: failure()
        run: npx prettier --write .
      - name: Commit and push prettier fixes
        if: failure()
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: auto-format code with prettier"
          add: "."

  lint:
    needs: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm run lint

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm run typecheck

  audit:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm audit --audit-level=moderate

  test:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci
      - run: npm run build

  playwright:
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Start dev server
        run: npm run dev &
      - name: Wait for dev server
        run: npx wait-on http://localhost:5173 --timeout 30000
      - name: Start express server
        run: npm run server &
      - name: Wait for express server
        run: npx wait-on http://localhost:3333 --timeout 30000
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
